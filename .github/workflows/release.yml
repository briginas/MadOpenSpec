name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Check the stable version tag
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Extract release notes from the changelog
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="[${GITHUB_REF_NAME#v}]" '
            /^##[[:space:]]/ { if (found) exit; found = ($2 == heading); next }
            /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing release notes for $GITHUB_REF_NAME in CHANGELOG.md" >&2
            exit 1
          fi
      - run: npm ci
      - name: Pack and install the release archive
        run: |
          version=${GITHUB_REF_NAME#v}
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm install --prefix . "$RUNNER_TEMP/mad-openspec-$version.tgz"
          test "$(node_modules/.bin/mad-openspec --version)" = "$version"
          node_modules/.bin/mad-openspec setup --dry-run --json | jq -e '.toolchain == "planned"'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/mad-openspec-*.tgz
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref_name != vars.NPM_BOOTSTRAP_TAG
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Publish the checked tarball
        run: npm publish "$RUNNER_TEMP/release/mad-openspec-${GITHUB_REF_NAME#v}.tgz" --access public --registry=https://registry.npmjs.org

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Verify the public npm version
        timeout-minutes: 12
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="$RUNNER_TEMP/release/mad-openspec-$version.tgz"
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          for attempt in {1..60}; do
            if actual=$(curl -fsS --max-time 10 "https://registry.npmjs.org/mad-openspec/$version" | jq -er '.dist.integrity'); then
              if [[ "$actual" != "$expected" ]]; then
                echo "Registry integrity differs from the tested archive" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for mad-openspec@$version" >&2
          exit 1
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/release/release-notes.md"
